[package]
name = "jerky"
version = "0.10.0"
authors = ["Shunsuke Kanda (kampersanda) <shnsk.knd@gmail.com>",
           "Jan-Paul Bultmann (somethingelseentirely) <jp@bultmann.eu>"]
description = "Succinct on-disk data structures in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/jerky"
repository = "https://github.com/triblespace/jerky"
homepage = "https://github.com/triblespace/jerky"
keywords = ["succinct", "compression"]
categories = ["data-structures"]
edition = "2018"
rust-version = "1.61.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num-traits = "0.2.15"
anybytes = { version = "0.20.3", path = "../anybytes", features = ["zerocopy", "mmap"] }
zerocopy = "0.8"
cubecl = { package = "maryml-cubecl", version = "0.10.0", path = "../cubecl-fork/crates/cubecl", default-features = false, features = ["wgpu", "std"], optional = true }

[features]
default = []
intrinsics = []
# GPU batch query kernels (wgpu: Metal/Vulkan/DX12) for WaveletMatrix.
# Requires a recent stable toolchain (cubecl's MSRV), unlike the base crate.
gpu = ["dep:cubecl"]

[[example]]
name = "gpu_bench"
required-features = ["gpu"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex.html"]
