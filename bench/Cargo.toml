[package]
name = "jerky-bench"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
jerky = { path = "..", features = ["intrinsics"], version = "0.10.0" }
rand = "0.8.4"
anybytes = { version = "0.20.3", features = ["zerocopy", "mmap"], path = "../../anybytes" }
rand_chacha = "0.3.1"
suffix = "1.3.0"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "timing_bitvec_rank"
harness = false

[[bench]]
name = "timing_bitvec_select"
harness = false

[[bench]]
name = "timing_intvec_access"
harness = false

[[bench]]
name = "timing_chrseq_access"
harness = false

[[bin]]
name = "gen_lcps"
path = "src/gen_lcps.rs"

[[bin]]
name = "mem_bitvec"
path = "src/mem_bitvec.rs"

[[bin]]
name = "mem_intvec"
path = "src/mem_intvec.rs"

[[bin]]
name = "mem_chrseq"
path = "src/mem_chrseq.rs"

[[bin]]
name = "merge_vs_rebuild"
path = "src/merge_vs_rebuild.rs"
